appId: com.sogangssh.app
productName: sogangSSH
directories:
  buildResources: build
  output: release/${version}
# Allow-list: ship only the built app. electron-builder packs the working folder, not the git
# tree, so a deny-list would also pick up untracked local files (CLAUDE.local.md, notes, .claude/).
# package.json and production node_modules are always added by electron-builder.
files:
  - out/**
  - resources/**
asarUnpack:
  - resources/**
win:
  target: nsis
  executableName: sogangssh
nsis:
  # Same name as the url electron-builder writes into latest.yml for GitHub (no spaces), so a
  # release uploaded by hand matches it.
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
npmRebuild: false
# Update source for electron-updater: builds write latest.yml + .blockmap and put app-update.yml
# into the app. The build scripts pass --publish never, so nothing is uploaded from this PC.
publish:
  provider: github
  owner: hafnia-labs
  repo: sogangssh
  releaseType: prerelease
