appId: com.sogangssh.app
productName: sogangSSH
directories:
  buildResources: build
  output: release/${version}
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.json,.editorconfig}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{DESIGN.md,CLAUDE.md}'
asarUnpack:
  - resources/**
win:
  target: nsis
  executableName: sogangssh
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
npmRebuild: false
